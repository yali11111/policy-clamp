apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clamp-ingress
  namespace: clamp-system
spec:
  rules:
    - host: clamp.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
