apiVersion: apps/v1
kind: Deployment
metadata:
  name: beam-optimizer
  namespace: clamp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beam-optimizer
  template:
    metadata:
      labels:
        app: beam-optimizer
    spec:
      containers:
        - name: ml
          image: beam-optimizer:latest
          ports:
            - containerPort: 8000
