apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-orchestrator
  namespace: clamp-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-orchestrator
  template:
    metadata:
      labels:
        app: java-orchestrator
    spec:
      containers:
        - name: java
          image: java-orchestrator:latest
          ports:
            - containerPort: 8085
